name: Debug Build (PR)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this debug APK as a GitHub pre-release
        required: true
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - devel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew assembleDebug --stacktrace --info --no-build-cache --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Comment PR with artifact link
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const comment = `Debug APK built successfully!\n\nDownload artifact: [debug-apk](${runUrl})\n\n_Artifact will be available for 7 days_`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  publish_debug_release:
    name: Publish debug APK pre-release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: release-assets

      - name: Publish debug APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: debug-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          name: "Kazuji Debug #${{ github.run_number }}.${{ github.run_attempt }}"
          body: |
            APK de depuração para validar parsers no Kazuji.
            Pré-lançamento para testes; esta não é uma versão estável.

            Commit: `${{ github.sha }}`
            Ref: `${{ github.ref_name }}`
          draft: false
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: release-assets/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
